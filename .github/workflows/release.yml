name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches version files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          ok=1
          check() { if [ "$2" != "$want" ]; then echo "::error::$1 is '$2', tag wants '$want'"; ok=0; fi; }
          check ui/src-tauri/tauri.conf.json "$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' ui/src-tauri/tauri.conf.json | head -1)"
          check ui/package.json "$(sed -n 's/^ *"version": *"\([^"]*\)".*/\1/p' ui/package.json | head -1)"
          check ui/src-tauri/Cargo.toml "$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' ui/src-tauri/Cargo.toml | head -1)"
          check Cargo.toml "$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          [ "$ok" = 1 ]

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libudev-dev pkg-config
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: cd ui && bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tagName: ${{ github.ref_name }}
          releaseName: GMK87 Configurator ${{ github.ref_name }}
          releaseBody: "Desktop release. Linux: AppImage and .deb (the .deb installs the udev rule; for the AppImage see the README). Windows: NSIS installer (unsigned). SHA-256 checksums are attached as SHA256SUMS."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.AppImage' --pattern '*.deb' --pattern '*.exe'
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
